<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta http-equiv="x-ua-compatible" content="ie=edge"/>
    <title>About | Cris Calayan Abad-Santos, MD</title>
</head>

<body>
    <!-- NAVBAR -->
    <nav class="nav-main navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Cris Calayan Abad-Santos, MD</a>
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#nav-main"
                aria-controls="nav-main"
                aria-expanded="dlse"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="nav-main">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a
                            class="nav-link"
                            aria-current="page"
                            href="/">
                            Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/about">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/pricing">Pricing</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/services">Services</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/contact-us">Contact Us</a>
                    </li>
                </ul>
            </div>
        </div>
        <!-- /container -->
    </nav>

    <div class="container">
        <div class="row">
            <!-- Contact -->
            <section id="contact" class="ml-4 mb-5 mt-5">
                <h2>Contact Us</h2>
                <div class="container">
                    <div class="row row-cols-3">
                        <div class="card">
                            <div class="card-body">
                                <p>6303 Owensmouth Ave,<br/> 10th Floor,<br/> Woodland Hills, CA 91367</p>
                                <p>Hours: 10 AM to 5 PM PT</p>
                                <p>
                                    Tel: <a href="tel:8189923121">(818) 992-3121</a> or <a href="tel:7472977009">(747) 297-7009</a><br/>
                                    Fax: <a href="fax:8889595641">(888) 959-5641</a><br/>
                                    Email: <a href="mailto:info@drcris.org">info@drcris.org</a>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <hr/>

            <!-- CONTACT FORM -->
            <section id="contact-form" class="my-4">
                <h3>Contact Form</h3>
                <form
                    name="contactform"
                    action="mailto:info@drcris.org"
                    method="post"
                >
                    <div class="container">
                        <div class="row row-cols-2">
                            <div class="mb-3">
                                <label for="firstName">First Name</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="firstName"
                                    placeholder="First Name"
                                />
                            </div>
                            <div class="mb-3">
                                <label for="lastName">Last Name</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="lastName"
                                    placeholder="Last Name"
                                />
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="Company">Company</label>
                            <input
                                type="text"
                                class="form-control"
                                id="company"
                                placeholder="Company"
                            />
                        </div>
                        <div class="row row-cols-2">
                            <div class="mb-3">
                                <label for="email">Email Address</label>
                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    placeholder="Your email"/>
                            </div>
                            <div class="mb-3">
                                <label for="phone">Phone Number</label>
                                <input
                                    type="phone"
                                    class="form-control"
                                    id="phone"
                                    placeholder="Your phone"/>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="address">Address</label>
                            <input
                                type="text"
                                class="form-control"
                                id="address"
                                placeholder="Address"/>
                        </div>
                        <div class="row row-cols-3">
                            <div class="mb-3">
                                <label for="city">City</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="city"
                                    placeholder="City"/>
                            </div>
                            <div class="mb-3">
                                <label for="state">State</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="state"
                                    placeholder="State"/>
                            </div>
                            <div class="mb-3">
                                <label for="zip">Zip Code</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="zip"
                                    minlength="5"
                                    maxlength="5"
                                    placeholder="Zip Code"/>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="message">Message</label>
                            <textarea
                                class="form-control"
                                id="message"
                                rows="6"
                            ></textarea>
                        </div>
                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Send email
                        </button>
                    </div>
                </form>
            </section>
        </div>
    </div>

</body>
</html>
