<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta http-equiv="x-ua-compatible" content="ie=edge"/>
    <title>Contact | Dr. Cris Calayan Abad Santos</title>
</head>

<body>
    <!-- NAVBAR -->
    <nav class="nav-main navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/unbroken-my-journey/">Dr. Cris Calayan Abad Santos</a>
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#nav-main"
                aria-controls="nav-main"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="nav-main">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a
                            class="nav-link"
                            aria-current="page"
                            href="/unbroken-my-journey/">
                            Book
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/unbroken-my-journey/about/">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/unbroken-my-journey/pricing/">Unbroken</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/unbroken-my-journey/services/">Themes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" target="_blank" href="https://www.linkedin.com/in/cris-calayan-abad-santos-md-23249650">LinkedIn</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" target="_blank" href="https://www.facebook.com/drcris.org/">Facebook</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/unbroken-my-journey/contact-us/">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
        <!-- /container -->
    </nav>

    <main class="container page-shell">
            <!-- Contact -->
            <section id="contact" class="content-section">
                <div class="section-header">
                    <p class="section-kicker">Connect</p>
                    <h2>Contact Dr. Cris</h2>
                </div>
                        <div class="contact-card">
                                <p>
                                    Email: <a href="mailto:info@drcris.org">info@drcris.org</a><br/>
                                    LinkedIn: <a href="https://www.linkedin.com/in/cris-calayan-abad-santos-md-23249650" target="_blank">Cris Calayan Abad-Santos, MD</a><br/>
                                    Facebook: <a href="https://www.facebook.com/drcris.org/" target="_blank">drcris.org</a>
                                </p>
                        </div>
            </section>

            <!-- CONTACT FORM -->
            <section id="contact-form" class="content-section">
                <div class="content-panel">
                <h3>Contact Form</h3>
                <form
                    name="contactform"
                    action="mailto:info@drcris.org"
                    method="post"
                >
                        <div class="row">
                            <div class="col-12 col-md-6 mb-3">
                                <label for="firstName">First Name</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="firstName"
                                    placeholder="First Name"
                                />
                            </div>
                            <div class="col-12 col-md-6 mb-3">
                                <label for="lastName">Last Name</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="lastName"
                                    placeholder="Last Name"
                                />
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="company">Company</label>
                            <input
                                type="text"
                                class="form-control"
                                id="company"
                                placeholder="Company"
                            />
                        </div>
                        <div class="row">
                            <div class="col-12 col-md-6 mb-3">
                                <label for="email">Email Address</label>
                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    placeholder="Your email"/>
                            </div>
                            <div class="col-12 col-md-6 mb-3">
                                <label for="phone">Phone Number</label>
                                <input
                                    type="tel"
                                    class="form-control"
                                    id="phone"
                                    placeholder="Your phone"/>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="address">Address</label>
                            <input
                                type="text"
                                class="form-control"
                                id="address"
                                placeholder="Address"/>
                        </div>
                        <div class="row">
                            <div class="col-12 col-md-4 mb-3">
                                <label for="city">City</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="city"
                                    placeholder="City"/>
                            </div>
                            <div class="col-12 col-md-4 mb-3">
                                <label for="state">State</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="state"
                                    placeholder="State"/>
                            </div>
                            <div class="col-12 col-md-4 mb-3">
                                <label for="zip">Zip Code</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="zip"
                                    minlength="5"
                                    maxlength="5"
                                    placeholder="Zip Code"/>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="message">Message</label>
                            <textarea
                                class="form-control"
                                id="message"
                                rows="6"
                            ></textarea>
                        </div>
                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Send email
                        </button>
                </form>
                </div>
            </section>
    </main>

</body>
</html>
